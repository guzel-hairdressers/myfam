<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MyFam</title>
  <meta name="description" content="Private, lightweight voice and video calls. No accounts, no servers storing your data.">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyFam">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=2.3.6">
</head>
<body>
  <div id="app">
    <!-- Minimal Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </span>
        <span>MyFam</span>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="auto">Auto</option>
          <option value="en">EN</option>
          <option value="ru">RU</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
          <option value="de">DE</option>
          <option value="zh">ZH</option>
          <option value="tr">TR</option>
        </select>
        <div id="serverStatusBadge" class="status-badge status-connecting">
          <span class="status-dot"></span>
          <span id="serverStatusText" data-i18n="connecting">Connecting</span>
        </div>
      </div>
    </header>

    <main class="main-content">

      <!-- Lobby View -->
      <section id="lobbyView" class="view active">
        <div class="lobby-container">

          <!-- Primary Call Card -->
          <div class="card join-card">
            <div class="card-intro">
              <h1 data-i18n="heroTitle">Join</h1>
              <p data-i18n="heroSubtitle">Share a code or tap a group.</p>
            </div>

            <form id="joinForm">
              <!-- Code Input -->
              <div class="field-group">
                <label for="codeInput" data-i18n="callCode">Call code</label>
                <div class="code-field">
                  <input type="text" id="codeInput" class="code-input" placeholder="742-918" maxlength="8" autocomplete="off" autocorrect="off" autocapitalize="characters" inputmode="numeric" required>
                  <div class="code-actions">
                    <button type="button" id="lobbyCopyBtn" class="code-action-btn" title="Copy invite link" data-i18n-title="copyInviteTitle" aria-label="Copy invite link">
                      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                      </svg>
                    </button>
                    <button type="button" id="newCodeBtn" class="code-action-btn" title="Generate new code" data-i18n-title="newCodeTitle" aria-label="Generate new code">
                      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Your Name -->
              <div class="field-group">
                <label for="nameInput"><span data-i18n="yourName">Your name</span> <span class="muted" data-i18n="optional">(optional)</span></label>
                <input type="text" id="nameInput" class="text-input" placeholder="e.g. Alex, Mom" data-i18n-placeholder="namePlaceholder" maxlength="24">
                <label class="remember-row">
                  <input type="checkbox" id="rememberNameCheckbox" checked>
                  <span data-i18n="rememberName">Remember my name on this device</span>
                </label>
              </div>

              <!-- Collapsible Network Options (Hidden by default for simplicity) -->
              <details class="advanced-drawer">
                <summary>
                  <span data-i18n="connectionOptions">Connection options</span>
                  <svg class="chevron" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </summary>
                <div class="advanced-body">
                  <div class="field-group">
                    <label for="presetSelect" data-i18n="quality">Quality</label>
                    <select id="presetSelect" class="select-control">
                      <option value="auto" selected data-i18n="qualityAuto">Auto (Adapts to network)</option>
                      <option value="potato" data-i18n="qualityPotato">Ultra-Low (~45 kbps)</option>
                      <option value="low" data-i18n="qualityLow">Low (~120 kbps)</option>
                      <option value="balanced" data-i18n="qualityBalanced">Balanced (~350 kbps)</option>
                      <option value="hd" data-i18n="qualityHd">HD (~750 kbps)</option>
                    </select>
                  </div>

                  <label class="toggle-row">
                    <input type="checkbox" id="forceStealthModeCheckbox">
                    <span class="toggle-copy">
                      <strong data-i18n="stealthTitle">Stealth Tunnel (TLS 443)</strong>
                      <small data-i18n="stealthDesc">Use if normal calls are blocked by firewall</small>
                    </span>
                  </label>
                </div>
              </details>

              <div id="joinError" class="alert-box error hidden"></div>

              <button type="button" id="joinBtn" class="btn-primary">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                <span data-i18n="startCall">Start Call</span>
              </button>
            </form>
          </div>

          <!-- Saved Contacts -->
          <div class="contacts-section">
            <div class="contacts-header">
              <h2 data-i18n="contacts">Groups</h2>
              <button type="button" id="addContactBtn" class="btn-ghost" data-i18n="addContact">+ Add</button>
            </div>
            <div id="contactsList" class="contacts-list"></div>
          </div>

        </div>
      </section>

      <!-- Active Call View -->
      <section id="callView" class="view">
        <!-- Minimal Floating Top Pill Bar -->
        <div class="call-top-bar">
          <div class="pill-group">
            <span id="hudCodeDisplay" class="pill-code">--</span>
            <button id="copyInviteBtn" class="pill-icon-btn" title="Copy invite link" aria-label="Copy invite link">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>

          <div class="pill-group pill-metrics">
            <span id="hudTransport" class="hud-badge">Connecting</span>
            <span id="hudPing" class="hud-meta">-- ms</span>
            <span id="hudBitrate" class="hud-meta hide-mobile">-- kbps</span>
            <button id="quickStealthBtn" class="pill-action-btn" title="Switch to TLS 443 tunnel">Relay</button>
          </div>
        </div>

        <!-- Video Stage (supports up to 4 remote peers + local PiP = 5 people) -->
        <div class="video-stage">
          <div id="remoteGrid" class="remote-grid" data-count="0">
            <!-- Waiting state when no other family members have joined yet -->
            <div id="waitingState" class="avatar-display waiting-state">
              <div class="avatar-circle">
                <span>...</span>
              </div>
              <div class="remote-name-wrapper">
                <span class="name-tag" data-i18n="waitingFamily">Waiting for family to join...</span>
              </div>
            </div>
          </div>
          <canvas id="remoteCanvas" class="stealth-canvas hidden"></canvas>

          <!-- PiP Local Video -->
          <div id="localContainer" class="video-box local-video-box">
            <video id="localVideo" autoplay playsinline muted></video>
            <canvas id="localCanvas" class="stealth-canvas hidden"></canvas>

            <div id="localAvatar" class="avatar-display avatar-mini hidden">
              <div class="avatar-circle avatar-circle-mini">
                <span id="localInitials">You</span>
                <div id="localSpeakingWave" class="speaking-ring"></div>
              </div>
            </div>

            <div class="local-name-tag" data-i18n="you">You</div>
          </div>
        </div>

        <!-- Floating Bottom Dock -->
        <footer class="call-controls-wrap">
          <div class="call-controls">
            <button id="toggleMicBtn" class="ctrl-btn" title="Mute / Unmute" aria-label="Toggle Microphone">
              <svg class="icon-mic-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
              <svg class="icon-mic-off hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>

            <button id="toggleCamBtn" class="ctrl-btn" title="Camera On / Off" aria-label="Toggle Camera">
              <svg class="icon-cam-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              <svg class="icon-cam-off hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M21 21l-3.6-2.7L23 17V7l-7 5V5a2 2 0 0 0-2-2H4.8M1 1l22 22"></path>
                <path d="M1 5v14a2 2 0 0 0 2 2h14"></path>
              </svg>
            </button>

            <button id="flipCamBtn" class="ctrl-btn" title="Flip Camera" aria-label="Flip Camera">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 2.21.895 4.21 2.343 5.657L4 18h6v-6l-2.293 2.293C6.645 13.231 6 11.7 6 10c0-3.314 2.686-6 6-6s6 2.686 6 6c0 1.7-.645 3.231-1.707 4.293L14 12v6h6l-2.343-2.343C19.105 14.21 20 12.21 20 10z"/>
              </svg>
            </button>

            <button id="shareScreenBtn" class="ctrl-btn hide-mobile" title="Share Screen" aria-label="Share Screen">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </button>

            <button id="openSettingsBtn" class="ctrl-btn" title="Quality & Connection" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>

            <button id="hangupBtn" class="ctrl-btn ctrl-btn-danger" title="End Call" aria-label="End Call">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
              </svg>
            </button>
          </div>
        </footer>
      </section>

    </main>

    <!-- Contact Modal -->
    <div id="contactModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="contactModalTitle" data-i18n="saveContact">Save Group</h3>
          <button id="closeContactModalBtn" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="field-group">
            <label for="contactNameInput" data-i18n="contactName">Name</label>
            <input type="text" id="contactNameInput" class="text-input" placeholder="e.g. Mom, Dad" data-i18n-placeholder="contactNamePlaceholder" maxlength="24">
          </div>
          <div class="field-group">
            <label for="contactCodeInput" data-i18n="callCode">Call code</label>
            <input type="text" id="contactCodeInput" class="text-input mono-input" placeholder="742-918" maxlength="8">
          </div>
          <p class="text-hint" data-i18n="savedLocally">Saved locally on this device only.</p>
        </div>
        <div class="modal-footer">
          <button type="button" id="saveContactBtn" class="btn-primary" data-i18n="save">Save</button>
        </div>
      </div>
    </div>

    <!-- Settings & Diagnostics Modal -->
    <div id="settingsModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 data-i18n="connectionQuality">Connection & Quality</h3>
          <button id="closeSettingsBtn" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="field-group">
            <label for="modalPresetSelect" data-i18n="quality">Quality</label>
            <select id="modalPresetSelect" class="select-control">
              <option value="auto" selected data-i18n="qualityAuto">Auto (Adapts to network)</option>
              <option value="potato" data-i18n="qualityPotato">Ultra-Low (~45 kbps)</option>
              <option value="low" data-i18n="qualityLow">Low (~120 kbps)</option>
              <option value="balanced" data-i18n="qualityBalanced">Balanced (~350 kbps)</option>
              <option value="hd" data-i18n="qualityHd">HD (~750 kbps)</option>
            </select>
          </div>

          <label class="toggle-row">
            <input type="checkbox" id="modalStealthToggle">
            <span class="toggle-copy">
              <strong data-i18n="stealthTitle">Stealth Tunnel (TLS 443)</strong>
              <small data-i18n="stealthModalDesc">Bypass strict firewalls by routing media over HTTPS port 443</small>
            </span>
          </label>

          <div class="stats-panel">
            <div class="stats-grid">
              <div class="stat-box">
                <span class="stat-num" id="statPing">--</span>
                <span class="stat-name" data-i18n="ping">Ping</span>
              </div>
              <div class="stat-box">
                <span class="stat-num" id="statLoss">0%</span>
                <span class="stat-name" data-i18n="loss">Loss</span>
              </div>
              <div class="stat-box">
                <span class="stat-num" id="statBitrate">--</span>
                <span class="stat-name" data-i18n="bitrate">Bitrate</span>
              </div>
              <div class="stat-box">
                <span class="stat-num" id="statProtocol">--</span>
                <span class="stat-name" data-i18n="route">Route</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="applySettingsBtn" class="btn-primary" data-i18n="done">Done</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="i18n.js?v=1.0.4"></script>
  <script src="app.js?v=2.3.9"></script>
</body>
</html>
